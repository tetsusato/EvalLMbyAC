exp:
    summary: "IPSJ2026の論文投稿用の実験．多数のLLMを使うとすげー遅いので，高速化実験タスク．調査タスクなので07で独立させるか．"
    run_suffix: "" # Run名に付与する補足説明 (e.g. "ae" -> title(ae))
    llm: "google/gemma-1.1-7b-it" # 呼び出しシェルから上書きされる
    input: "./kaggle-resume/12635195.txt" # 呼び出しシェルから上書きされる
    inputs_limit: 100
    log_dir: "./log_ipsj2026paper"
    device: "auto"
    #device: "cpu"
    use_cache: True # KV cache
    hosting: "huggingface" # or "openai", "vllm"
    max_vocab_size: 200000 # VR-LMCR計算用の語彙数基準値
    gamma: 1.0 # VR-LMCR計算用パラメータ
    clear_previous_runs: False  # 実験開始時に同じexp_titleの過去のrunを削除するか
    encoding_algorithm: "ae" # or "ppl" 

cache:
    l1_cache:
        enable: False
        top_dir: "CacheStorage"
        root: "ipsj2026_paper"
    l2_cache:
        enable: True
        top_dir: "CacheStorage_LLM"

exp_models:
  target_models:
    - "HuggingFaceTB/SmolLM2-1.7B-Instruct"
    - "llm-jp/llm-jp-3-440m-instruct2"
    - "llm-jp/llm-jp-3-980m-instruct2"
    - "Qwen/Qwen2-0.5B-Instruct"
    - "tiiuae/Falcon3-1B-Instruct"

    - "google/gemma-1.1-7b-it"
    - "google/gemma-2-27b-it"
    - "google/gemma-2b-it"
    - "google/gemma-7b-it"
    - "Qwen/Qwen2-1.5B-Instruct"
    - "Qwen/Qwen1.5-0.5B-Instruct"
    - "Qwen/Qwen1.5-4B-Chat"
    - "Qwen/Qwen2.5-0.5B-Instruct"
    - "Qwen/Qwen2.5-1.5B-Instruct"
    - "Qwen/Qwen2.5-3B-Instruct"
    - "Qwen/Qwen2.5-7B-Instruct"
    - "Qwen/Qwen2.5-14B-Instruct"
    - "Qwen/Qwen2.5-32B-Instruct"

